name: ursa-major-test

# The resolver's own tests, on every pull request that touches it and on
# every push to main. Until this file existed nothing ran them, so main
# went red without anyone seeing it (definition-of-done walk, 2026-11-19).
on:
  pull_request:
    paths:
      - 'ursa-major/**'
      - '.github/workflows/ursa-major-test.yml'
  push:
    branches: [main]
    paths:
      - 'ursa-major/**'
      - '.github/workflows/ursa-major-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ursa-major
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ursa-major/.nvmrc
          cache: npm
          cache-dependency-path: ursa-major/package-lock.json
      - name: Identity for the tests that make commits
        run: |
          git config --global user.name "ursa-major-test"
          git config --global user.email "ursa-major-test@users.noreply.github.com"
      - run: npm ci --no-audit --no-fund
      - run: npm test
