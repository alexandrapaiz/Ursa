name: frontend-agent

on:
  schedule:
    - cron: "15 14 * * 1,4"  # Mon+Thu 14:15 UTC; activated 2026-09-24 by owner directive (ADR below)
  workflow_dispatch:
    inputs:
      owner_instructions:
        description: "Owner instructions for this run (bind for this run)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      BOARD_API_URL: ${{ secrets.BOARD_API_URL }}
      BOARD_RUNTIME_TOKEN: ${{ secrets.BOARD_RUNTIME_TOKEN }}
      # Traces: this run lands in Langfuse as one trace, a span per tool call
      # (runtime/langfuse/ in the HQ repo). The auth header is set by the step below.
      CLAUDE_CODE_ENABLE_TELEMETRY: "1"
      CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "1"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.LANGFUSE_HOST }}/api/public/otel
      OTEL_LOG_USER_PROMPTS: "1"
      OTEL_LOG_ASSISTANT_RESPONSES: "1"
      OTEL_LOG_TOOL_DETAILS: "1"
      OTEL_RESOURCE_ATTRIBUTES: service.name=Ursa-frontend,langfuse.environment=Ursa,langfuse.user.id=frontend,langfuse.session.id=${{ github.run_id }}
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Trace this run to Langfuse
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          if [ -z "$LANGFUSE_PUBLIC_KEY" ] || [ -z "$LANGFUSE_SECRET_KEY" ]; then
            echo "No Langfuse keys on this repo; this run is not traced."
            echo "OTEL_TRACES_EXPORTER=none" >> "$GITHUB_ENV"; exit 0
          fi
          auth=$(printf '%s:%s' "$LANGFUSE_PUBLIC_KEY" "$LANGFUSE_SECRET_KEY" | base64 -w0)
          echo "::add-mask::$auth"
          echo "OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic $auth" >> "$GITHUB_ENV"
          echo "Traced: seat frontend of Ursa, run ${{ github.run_id }}."
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are Ursa's frontend engineer (ADR-23 in
            docs/decisions.md), running in GitHub Actions with this
            repository already checked out and Node 20 available. Read
            docs/vision.md section 0 and prompts/frontend-agent.md; the
            charter is your full instruction set. Execute the run exactly as
            it specifies: build the site, screenshot every page at the three
            viewports with Playwright, LOOK at every screenshot and judge it
            visually (never call a page fine without having seen it
            rendered), fix what you find, benchmark two or three
            best-in-class AI product sites for interaction craft, implement
            at most two verified polish refinements, and ship the evidence
            as screenshots in docs/design/reviews/ inside ONE pull request
            on a branch named fe/YYYY-MM-DD-slug via `gh pr create`. Protect
            the fixed design identity: black and white only, Apple-clean,
            and the hero mark's owner-approved geometry is untouchable.
            Never merge your own PR, never push to main, never touch
            secrets or digests/. If the charter file is missing, stop and
            fail loudly instead of improvising.
            Owner instructions for this dispatch, binding for this run and
            extending the charter (empty on scheduled runs):
            ${{ inputs.owner_instructions }}
          claude_args: "--max-turns 250 --permission-mode bypassPermissions --model claude-opus-5"
      # The no-ship tripwire. Runs have worked for dozens of turns, reported
      # success, and lost everything at teardown because nothing was pushed
      # (alexandria's register; incident numbering differs per repo). A green
      # conclusion is not evidence of shipping.
      - name: No-ship tripwire
        if: always()
        run: |
          git fetch origin --quiet 2>/dev/null || true
          branch=$(git rev-parse --abbrev-ref HEAD)
          base="${GITHUB_REF_NAME:-main}"
          dirty=$(git status --porcelain)
          commits=0
          if git rev-parse "origin/$base" >/dev/null 2>&1; then
            commits=$(git rev-list --count "origin/$base..HEAD" 2>/dev/null || echo 0)
          fi
          # Remote branches containing HEAD, EXCLUDING the base branch itself. A run
          # that never branched leaves HEAD on origin/$base, which used to satisfy
          # this check trivially: epitome run 35956231272 (2026-09-24) died at turn
          # one, produced nothing, and the tripwire still reported success.
          pushed=$(git branch -r --contains HEAD 2>/dev/null | tr -d ' ' | grep -v "^origin/$base$" || true)
          pr=$(gh pr list --head "$branch" --state all --json number --jq '.[0].number' 2>/dev/null || true)
          {
            echo "### Did this run ship anything?"
            echo ""
            echo "- branch: \`$branch\` ($commits commit(s) ahead of $base)"
            echo "- pushed to a seat branch: ${pushed:-NO}"
            echo "- pull request: ${pr:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$dirty" ]; then
            echo "::warning::Uncommitted changes were left in the sandbox and are lost at teardown."
            printf '%s\n' "$dirty" | head -20
          fi
          if [ "$commits" = "0" ] && [ -z "$pr" ] && [ -z "$dirty" ]; then
            echo "::error::This run produced nothing at all: no commit, no seat branch, no pull request. A green model step is not evidence of work; read the seat run step's own outcome."
            exit 1
          fi
          if [ "$commits" != "0" ] && [ -z "$pushed" ]; then
            echo "::error::This run made commits that were never pushed, so the work dies with the sandbox. See the 'Ship first, then work' rule in the pm standard (§8) and in this seat's charter."
            exit 1
          fi
          if [ -z "$pr" ]; then
            echo "::warning::No pull request exists for branch $branch. A run with nothing to ship must say so in a draft PR and close it, rather than ending silently."
          fi
      # Visibility window (standards/operating-modes.md §3): the seat's run
      # report goes to the team's channel when the owner has created one.
      # Seats never read the channel; it is the owner's window only.