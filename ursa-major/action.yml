# The resolver as a reusable GitHub Action — stage one of the surfaces.
#
# A consumer repository adds one workflow that calls this Action when a
# pull request merges. From then on every merge produces outcome records
# on its own runner and one run comment on the pull request, and nobody
# runs anything by hand.
#
# Reference it as:
#   uses: alexandrapaiz/Ursa/ursa-major@main
#
# WHICH BUILD YOU GET, SAID PLAINLY, because `@main` reads like a neutral
# install line and it is not one yet. This project publishes no tags and
# no releases, so `@main` is the only reference it offers, and `main`
# rebuilt dist/ursa.cjs sixteen times in the eleven days to 2026-10-16.
# The resolver that reads your merge this week is therefore not
# guaranteed to be the one that read it last week. Two things follow.
#
# You can pin today, without waiting for a tag. A commit sha works and is
# supported: `uses: alexandrapaiz/Ursa/ursa-major@<sha>`. That freezes
# both the Action's steps and the bundle they run, which is the whole
# artifact.
#
# And whichever you choose, every record says which build wrote it. Each
# record carries `task.resolvedBy`, the identity of the code that made
# its claims, and `task.gatedBy`, the set of rules those claims were
# checked against. On this path `task.resolvedBy` is a SHA-256 prefix of
# the bundle's own bytes, because GitHub downloads an action as a tarball
# and there is no git history under it to name. So a figure in the run
# comment can always be traced to a build, which is a weaker guarantee
# than a version number and a stronger one than nothing.
#
# Composite rather than a docker container, per the product plan §9: the
# runner's own checkout happens first, with the runner's own git and
# token, and the step that reads the repository is plain auditable YAML
# the consumer can read before it runs anything.
#
# It installs nothing. The step below runs ursa-major/dist/ursa.cjs, one
# committed CommonJS file, with the node that is already on the runner.
# No npm install, no npx download, no container pull, no registry
# reachability. That is deliberate: the resolver must never block on what
# a runner lacks.
#
# Where the data goes: records are written to .ursa/ inside the runner's
# workspace and the workspace is destroyed when the job ends. Nothing is
# uploaded. The only thing that leaves the runner is the run comment,
# which carries five aggregate numbers and one file path, and the
# consumer's own GITHUB_TOKEN writes it to the consumer's own pull
# request. No Ursa-operated compute is involved at any point.

name: 'Ursa Major resolver'
description: 'Resolve a merged pull request into outcome records and post the five-field run comment. Installs nothing; runs on the runner you already have.'
author: 'Ursa'

branding:
  icon: 'git-merge'
  color: 'blue'

inputs:
  project-path:
    description: 'Path to the checked-out repository to resolve. Defaults to the workspace the consumer''s checkout step wrote.'
    required: false
    default: ${{ github.workspace }}
  github-token:
    description: 'Token used to post the run comment and read the 👍 on the previous one. Needs pull-requests: write. The default GITHUB_TOKEN is enough.'
    required: false
    default: ${{ github.token }}
  min-chars:
    description: 'Smallest generated-character count worth a record. Matches the local launch''s default of 200; raise it on a repository full of small generated commits.'
    required: false
    default: '200'
  post-comment:
    description: 'Set to false to print the run comment in the job log instead of posting it. Useful for a first dry run on a repository nobody wants commented on yet.'
    required: false
    default: 'true'
  resolve-from:
    description: |
      Which history the resolver reads, and therefore which events this Action can run on.

      `merge` (the default, and the only behaviour before 2026-10-18) reads the merge window out of
      a pull_request event payload, resolves what that one merge accepted, and posts the run comment.
      It requires a pull_request event and does nothing useful without one.

      `history` reads the whole checkout's git history instead, the way `ursa run` does on a laptop,
      and needs no event payload at all. Use it on `push` or `workflow_dispatch`, which is what the
      GitHub Pages path below needs, because a Pages deployment must run on your default branch and a
      pull_request event does not.

      In `history` mode there is no pull request to comment on, so no comment is posted and the six
      resolver outputs below are empty. The records, and the site if you asked for one, are the output.
    required: false
    default: 'merge'
  publish-dir:
    description: |
      Leave empty and nothing is published; this is the default and the Action behaves exactly as it
      did before this input existed.

      Set it to a directory and the Action writes a complete static site there after resolving: one
      self-contained HTML page per record, the record's own JSON beside it, and an index.html and
      index.json over the set. Nothing is uploaded and nothing leaves the runner. Your own next step
      decides what happens to the directory; `examples/publish-record.yml` hands it to
      actions/upload-pages-artifact and publishes it to your repository's own GitHub Pages site.

      READ THIS BEFORE YOU SET IT. A published record carries raw text, not a summary: the full text
      of every finished file in it, the full text of every model generation, and every message you
      typed to the model. Setting this input is the acknowledgement of that, and the Action passes
      `--yes` to `ursa publish` on your behalf because a workflow has no terminal to ask at. The job
      log prints the exact counts and every file path before it writes anything, so the first run on
      a repository tells you precisely what a second run would make public. If you want to read that
      list before anything is written, run once with `publish-dir` set and no Pages deployment step
      after it.
    required: false
    default: ''
  agent-identity:
    description: |
      Identities in this repository that belong to an agent rather than to a person, one per line.
      Each line is a substring matched case-insensitively against a commit's author name and its author email.

      Leave it empty unless your repository has agents committing under their own git identity. The
      resolver already recognises the harness and vendor names it can recognise (claude, codex, cursor,
      gpt, copilot, github-actions, and GitHub's [bot] suffix) on both the Co-Authored-By trailer and the
      author name. What it cannot recognise is a seat you named yourself: Ursa's own agents commit as
      ursa-pm and ursa-engineer at agents.epito.me, and no default shippable to every repository matches
      those. An identity the pattern has never heard of is promoted to "a human being" in silence, and
      every survived_* span in every record rests on that one bit, so declaring them is how the party who
      knows the fleet tells the resolver what it cannot infer.

      Declaring an identity only ever narrows what a record claims: those commits become generations, so
      they stop being eligible as a person's edit and the records that rested on them are never written.

      Example:
        agent-identity: |
          ursa-pm
          agents.epito.me
    required: false
    default: ''
  anthropic-api-key:
    description: 'Optional. With no key the distiller runs in CI mode: records are resolved, no interpretation pass runs, and the tuning delta is an honest zero. Pass a key only if you also install the claude CLI in the job; the Action never installs it for you.'
    required: false
    default: ''

outputs:
  units-resolved:
    description: 'Number of work units that became outcome records in this merge.'
    value: ${{ steps.resolve.outputs.units-resolved }}
  units-found:
    description: 'Number of work units found in the merge window, resolved or not.'
    value: ${{ steps.resolve.outputs.units-found }}
  chars-survived-verbatim:
    description: 'Characters of generated text kept unchanged.'
    value: ${{ steps.resolve.outputs.chars-survived-verbatim }}
  chars-survived-edited:
    description: 'Characters of generated text kept after editing.'
    value: ${{ steps.resolve.outputs.chars-survived-edited }}
  most-corrected-artifact:
    description: 'Path of the file carrying the most edited characters, or the empty string when nothing was edited.'
    value: ${{ steps.resolve.outputs.most-corrected-artifact }}
  tuning-delta:
    description: 'Preference units added and reinforced, as "<added>/<reinforced>".'
    value: ${{ steps.resolve.outputs.tuning-delta }}
  tuning-mode:
    description: 'Either "distilled" (a model interpreted the corrections) or "ci-no-model" (none was reachable, so the delta is a zero from absence, not from a model finding nothing).'
    value: ${{ steps.resolve.outputs.tuning-mode }}
  comment-url:
    description: 'URL of the run comment, or the empty string when post-comment was false.'
    value: ${{ steps.resolve.outputs.comment-url }}
  publish-dir:
    description: 'Directory the static site was written to, or the empty string when publish-dir was not set. Pass it to actions/upload-pages-artifact.'
    value: ${{ steps.publish.outputs.dir }}

runs:
  using: composite
  steps:
    # The pair finder compares a generated commit's blob with the next
    # human commit's blob, so both commits have to be in the local object
    # store. A default checkout is depth 1 and has neither. Deepening
    # here, rather than asking every consumer to remember
    # fetch-depth: 0, is the difference between the Action working and
    # the Action silently resolving nothing.
    #
    # Runs in both resolve-from modes and matters more in `history`,
    # which walks the whole history rather than one merge window.
    - name: Deepen a shallow clone so both sides of each commit pair exist
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ inputs.project-path }}"
        if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
          echo "shallow clone: fetching full history so both sides of each commit pair exist"
          git fetch --quiet --unshallow origin || git fetch --quiet --depth=500 origin
        else
          echo "full clone: no deepening needed"
        fi

    - name: Resolve the merge into outcome records and post the run comment
      id: resolve
      if: inputs.resolve-from == 'merge'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        URSA_AGENT_IDENTITY: ${{ inputs.agent-identity }}
      run: |
        set -euo pipefail
        node --version
        args=(
          ci "${{ inputs.project-path }}"
          --repo "${{ github.repository }}"
          --event "${{ github.event_path }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --min-chars "${{ inputs.min-chars }}"
        )
        if [ "${{ inputs.post-comment }}" != "true" ]; then args+=(--no-post); fi
        # One --agent-identity per non-blank line of the input. Read from
        # the environment rather than interpolated into this script, so a
        # value carrying a quote or a backtick stays data and never
        # becomes shell. Blank lines are skipped because a YAML block
        # scalar written in the natural way ends with one.
        while IFS= read -r identity; do
          [ -n "${identity//[[:space:]]/}" ] || continue
          args+=(--agent-identity "$identity")
        done <<< "$URSA_AGENT_IDENTITY"
        # One invocation. It writes the five fields to $GITHUB_OUTPUT
        # itself, so the outputs below come from the run that produced
        # them rather than from a second pass over the log.
        node "$GITHUB_ACTION_PATH/dist/ursa.cjs" "${args[@]}" | tee "$RUNNER_TEMP/ursa-ci.log"

    # The same resolver over the whole checkout instead of over one merge
    # window. This is `ursa run`, the launch a person uses on a laptop,
    # and it reads git history rather than an event payload, which is the
    # only reason the GitHub Pages path can exist: a Pages deployment has
    # to run on your default branch, and a pull_request event does not.
    #
    # It posts no comment, because on a push there is no pull request to
    # comment on. The records are the output, and `publish-dir` turns them
    # into a page.
    - name: Resolve the whole history into outcome records
      id: resolve-history
      if: inputs.resolve-from == 'history'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        URSA_AGENT_IDENTITY: ${{ inputs.agent-identity }}
      run: |
        set -euo pipefail
        node --version
        args=(run "${{ inputs.project-path }}" --min-chars "${{ inputs.min-chars }}")
        # Same loop, same reason, as the merge step above: read from the
        # environment so a value carrying a quote stays data.
        while IFS= read -r identity; do
          [ -n "${identity//[[:space:]]/}" ] || continue
          args+=(--agent-identity "$identity")
        done <<< "$URSA_AGENT_IDENTITY"
        node "$GITHUB_ACTION_PATH/dist/ursa.cjs" "${args[@]}" | tee "$RUNNER_TEMP/ursa-ci.log"

    # Records into a directory of files a web server can serve. Writes
    # only; nothing is uploaded here and no network call is made. See the
    # `publish-dir` input above for what a published record contains.
    - name: Write the records as a static site
      id: publish
      if: inputs.publish-dir != ''
      shell: bash
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/dist/ursa.cjs" publish "${{ inputs.project-path }}" \
          --out "${{ inputs.publish-dir }}" \
          --repo "${{ github.repository }}" \
          --yes | tee -a "$RUNNER_TEMP/ursa-ci.log"
        echo "dir=${{ inputs.publish-dir }}" >> "$GITHUB_OUTPUT"

    # The five fields again, in the same order, in the job summary. The
    # comment is the feedback a person reads on the pull request; this is
    # the same reading for whoever opens the run instead. In `history`
    # mode there is no comment, and this is the only place the run's own
    # numbers are reported.
    - name: Repeat the run comment in the job summary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "## Ursa Major resolver"
          echo
          echo '```'
          cat "$RUNNER_TEMP/ursa-ci.log" 2>/dev/null || echo "the resolve step wrote no log"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
