name: ledger-gate

# The ledger is the one file every seat writes to on every run, which made it
# the only thing blocking five open pull requests on 2026-09-27. This gate
# keeps the two failure modes it is prone to out of `main`: an entry that does
# not meet the pm.md §4 contract, and a block that says the same thing twice
# because an append collision was resolved by hand.
#
# It also keeps out a third failure mode, added 2026-10-24: a `.gitattributes`
# merge attribute that does nothing. `merge=union` is the cheap-looking fix
# that silently merges two register entries into one and a half at exit 0, and
# a named driver no committed script registers is the default line merge
# wearing a convention's clothes. Both arrive as a one-line diff, so both need
# an exit code rather than a reviewer who happens to remember the measurement.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No `npm ci`: tools/ledger has no dependencies, because the merge driver
      # has to run during a `git merge` in a checkout where nothing is installed.
      - name: Merge driver and checker tests
        run: >-
          node --test
          tools/ledger/ledger.test.mjs
          tools/ledger/check.test.mjs
          tools/ledger/check-attributes.test.mjs
          tools/ledger/block-kinds.test.mjs
          tools/ledger/check-closures.test.mjs
          tools/registers/merge-driver.test.mjs
      # Without --clone, so this passes on a fresh checkout: it asks only
      # whether the committed declarations are ones some committed script
      # here can register, and refuses `merge=union` by name. The clone-local
      # half is a precondition for merging, not a property of the commit, and
      # the installers check it themselves.
      - name: Merge attributes resolve to a driver this repository defines
        run: node tools/ledger/check-attributes.mjs
      # Exit 2 is this checker's "clean as far as a seat can take it": every
      # remaining violation is one only the owner can resolve, because pm.md §4
      # reserves a status change to her. A plain `run:` step fails the job on
      # any non-zero status, so without this the gate would be red forever on a
      # line no seat is allowed to touch, which is how a gate stops being read.
      # Exit 1 still fails: that is the case a seat can and must repair.
      - name: Ledger contract
        run: |
          node tools/ledger/check.mjs docs/ideas.md && exit 0
          status=$?
          if [ "$status" = "2" ]; then
            echo "Exit 2: every remaining violation needs the owner. Not a seat's failure."
            exit 0
          fi
          exit "$status"
      # Same exit contract, same reason, different subject: a document in this
      # repository claiming to close a ledger entry the ledger still calls open.
      # Exit 2 here is a marker on a `proposed` entry, which only the owner can
      # move out of, so it is reported and does not fail the job.
      - name: Closure backlinks
        run: |
          node tools/ledger/check-closures.mjs docs/ideas.md && exit 0
          status=$?
          if [ "$status" = "2" ]; then
            echo "Exit 2: every remaining violation needs the owner. Not a seat's failure."
            exit 0
          fi
          exit "$status"
